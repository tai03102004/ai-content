version: '3.9'
services:
  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - ./chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_SERVER_AUTH_PROVIDER=chromadb.auth.token_auth.TokenAuthServerProvider
      - CHROMA_SERVER_AUTH_CREDENTIALS=Serpupdate@123