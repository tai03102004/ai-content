version: '3.9'

services:
  # Chỉ chạy mỗi Qdrant thôi, code Python chạy ngoài
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_local
    restart: always
    ports:
      - "6333:6333" # Để máy thật chọc vào được qua localhost:6333
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=Enterprise_Secret_Key_123
    volumes:
      - ./qdrant_data:/qdrant/storage:z # Giữ lại dữ liệu vector dù tắt Docker